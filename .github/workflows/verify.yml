name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # commit 评论需要写权限
  pull-requests: write

jobs:
  # 引擎闸门：零依赖，什么都不装，二十秒出结果。
  # 绝大多数改动只需要看这一个,保持它快是有意义的。
  gate:
    name: 引擎闸门
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 跑引擎闸门
        id: gate
        continue-on-error: true
        run: npm run verify

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: 失败则让 job 失败
        if: steps.gate.outcome != 'success'
        run: exit 1

  # 浏览器闸门：要装 Playwright，慢一分钟，只在这里承担。
  web:
    name: 浏览器闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装依赖
        run: npm install --no-audit --no-fund

      - name: 装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 跑浏览器闸门
        id: web
        continue-on-error: true
        run: npm run verify:web

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-web-artifacts
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: 失败则让 job 失败
        if: steps.web.outcome != 'success'
        run: exit 1

  # 汇总回写。
  #
  # 这一步是整条闭环的关键：agent 读不到 Actions 的原始日志，但读得到
  # PR 评论和 commit 评论。所以两条路都要通,只挂在 pull_request 上的话，
  # 直接 push 到 main 时报告就没地方去了。
  report:
    name: 回报结果
    runs-on: ubuntu-latest
    needs: [gate, web]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verify-report
          path: eng/

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verify-web-artifacts
          path: web/

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' +
                           context.repo.repo + '/actions/runs/' + context.runId;
            const engOk = '${{ needs.gate.result }}' === 'success';
            const webOk = '${{ needs.web.result }}' === 'success';

            const read = p => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) { return null; } };
            const eng = read('eng/verify-report.json');
            const web = read('web/verify-web-report.json');

            let body = '## 验证闸门 ' + (engOk && webOk ? '全部通过' : '有失败') + '\n\n';
            body += '提交 `' + context.sha.slice(0, 7) + '` · [完整日志](' + runUrl + ')\n\n';
            body += '| 闸门 | 结果 |\n| --- | --- |\n';
            body += '| 引擎 | ' + (engOk ? '通过' : '失败') + ' ' + (eng ? '(' + eng.passed + '/' + eng.total + ')' : '') + ' |\n';
            body += '| 浏览器 | ' + (webOk ? '通过' : '失败') + ' ' + (web ? '(' + web.passed + '/' + web.total + ')' : '') + ' |\n';

            if (eng) {
              const m = eng.metrics || {};
              body += '\n**引擎**\n\n';
              body += '- 单元测试 ' + (m.unitPass == null ? '?' : m.unitPass) + ' 条\n';
              body += '- 机器人 ' + m.seeds + ' 局 × ' + m.surviveSec + 's，高度中位 ' + m.medianScore + '（' + m.minScore + '-' + m.maxScore + '）\n';
              body += '- 最大平台间距 ' + m.worstGap + '，活跃平台 ' + m.platformsLive + '\n';
              body += '- 5min 模拟 ' + m.perfMs + ' ms\n';
            }
            if (web) {
              const m = web.metrics || {};
              body += '\n**浏览器**\n\n';
              body += '- 约 ' + m.fps + ' fps，画面采样颜色 ' + m.menuColors + ' → ' + m.playColors + ' 种\n';
              body += '- 机器人在浏览器里 高度 ' + m.botScore + ' · 跳跃 ' + m.botJumps + '\n';
            }

            const fails = [].concat(eng ? eng.failures : [], web ? web.failures : []).filter(Boolean);
            if (fails.length) {
              body += '\n**失败项**\n\n';
              for (const f of fails) body += '- ' + f + '\n';
            }
            if (eng && eng.unitTail) {
              body += '\n<details><summary>单元测试输出末尾</summary>\n\n```\n' +
                      eng.unitTail.slice(-3000) + '\n```\n</details>\n';
            }

            body += '\n<!-- verify-gate -->';

            const pr = context.payload.pull_request;

            if (pr) {
              // 有 PR：更新同一条评论，不刷屏
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, per_page: 100,
              });
              const prev = comments.find(c => c.body && c.body.includes('<!-- verify-gate -->'));
              if (prev) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: prev.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: pr.number, body,
                });
              }
            } else {
              // 没有 PR（直接 push 到分支或 main）：写 commit 评论。
              // agent 拿着 commit SHA 就能读到，不需要知道 PR 号。
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha, body,
              });
            }

            core.info('报告已送达。');

      # 回写失败必须让 job 红。
      # 以前这一步是静默的,权限配错的话，你会以为一切正常，
      # 实际上 agent 早就什么都看不到了。监控自己坏掉却没人知道，
      # 比被监控的东西坏掉更危险。
      - name: 送达失败视为闸门失败
        if: failure()
        run: |
          echo "报告没能回写。agent 读不到结果，等于整条闭环断了。"
          exit 1
