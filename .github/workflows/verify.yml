name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: 验证闸门
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 零依赖，没有 npm install 这一步

      - name: 跑验证闸门
        id: gate
        continue-on-error: true
        run: npm run verify

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      # agent 读不到 Actions 日志，但读得到 PR 评论。这一步是闭环的关键，
      # 所以失败细节必须尽量塞进这条评论里。
      - name: 回报结果到 PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ok = '${{ steps.gate.outcome }}' === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body = `## 验证闸门 ${ok ? '通过' : '失败'}\n\n`;
            body += `提交 \`${context.sha.slice(0,7)}\` · [完整日志](${runUrl})\n\n`;

            try {
              const r = JSON.parse(fs.readFileSync('artifacts/verify-report.json', 'utf8'));
              const m = r.metrics || {};
              body += `| 项 | 值 |\n| --- | --- |\n`;
              body += `| 通过 | ${r.passed} / ${r.total} |\n`;
              body += `| 单元测试 | ${m.unitPass ?? '?'} 条（${m.unitFiles} 个文件）|\n`;
              body += `| 机器人试玩 | ${m.seeds} 局 × ${m.surviveSec}s |\n`;
              body += `| 高度中位数 | ${m.medianScore}（${m.minScore} - ${m.maxScore}）|\n`;
              body += `| 累计跳跃 | ${m.totalJumps} |\n`;
              body += `| 最大平台间距 | ${m.worstGap} |\n`;
              body += `| 活跃平台 | ${m.platformsLive}（累计生成 ${m.platformsGenerated}）|\n`;
              body += `| 5min 模拟耗时 | ${m.perfMs} ms |\n`;

              if (r.failures && r.failures.length) {
                body += `\n**失败项**\n\n`;
                for (const f of r.failures) body += `- ${f}\n`;
              }
              if (r.unitFailing && r.unitFailing.length) {
                body += `\n**挂掉的单元测试**\n\n`;
                for (const t of r.unitFailing) body += `- \`${t}\`\n`;
              }
              if (r.unitTail) {
                body += `\n<details><summary>测试输出末尾</summary>\n\n\`\`\`\n` +
                        r.unitTail.slice(-3500) + `\n\`\`\`\n</details>\n`;
              }
              if (r.deaths && r.deaths.length) {
                body += `\n**摔死的局**\n\n| seed | 存活 | 得分 | 跳跃 |\n| --- | --- | --- | --- |\n`;
                for (const d of r.deaths.slice(0, 8)) {
                  body += `| ${d.seed} | ${d.sec}s | ${d.score} | ${d.jumps} |\n`;
                }
              }
            } catch (e) {
              body += `**没有生成 verify-report.json**,脚本在产出报告之前就挂了。`;
              body += ` 去 [完整日志](${runUrl}) 看 stderr。\n`;
            }

            body += `\n<!-- verify-gate -->`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.includes('<!-- verify-gate -->'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: 闸门失败则让 job 失败
        if: steps.gate.outcome != 'success'
        run: exit 1
