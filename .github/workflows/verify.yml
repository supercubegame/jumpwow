name: verify

# 只挂 push。以前同时挂 push 和 pull_request，于是 PR 上的每次推送都跑两遍
# 闸门、抢同一条评论。报告 job 会从 commit 反查 PR，所以 PR 上照样有评论。
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 引擎闸门：零依赖，什么都不装，二十秒出结果。
  # 绝大多数改动只需要看这一个,保持它快是有意义的。
  gate:
    name: 引擎闸门
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # stdout 同时 tee 成文件：闸门要是在写报告之前就死了，这份日志是唯一
      # 还留得下来的证据,而 CI 的原始日志，读评论的那个 agent 是打不开的。
      # pipefail 保证这一步的成败跟着 node 的退出码走，而不是 tee 的。
      - name: 跑引擎闸门
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run verify 2>&1 | tee artifacts/stdout-eng.log

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-eng
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: 失败则让 job 失败
        if: steps.gate.outcome != 'success'
        run: exit 1

  # 浏览器闸门：要装 Playwright，慢一分钟，只在这里承担。
  web:
    name: 浏览器闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装依赖
        run: npm install --no-audit --no-fund

      - name: 装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 跑浏览器闸门
        id: web
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run verify:web 2>&1 | tee artifacts/stdout-web.log

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-web
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: 失败则让 job 失败
        if: steps.web.outcome != 'success'
        run: exit 1

  # ==========================================================================
  # 报告 job 不在这个仓库里。它是 supercubegame/ci-workflows 里的一个文件，
  # supercubegame/image-grabber 调用的是同一个。
  #
  # 以前两个仓库各有一份逐字相同的拷贝，而那份一致性没有任何东西在守：每个
  # 仓库的闸门只看得见自己那份 workflow，同时改两边就是两边都绿而结构已经
  # 分叉。只有一份文件，这个问题就不存在了。
  #
  # 那个 job 为什么长成那样,不 clone、兜底评论前置、取脚本和回写都带重试、
  # 降级标红,全写在它自己的文件头里。一句话版本：image-grabber 的 run #51
  # 两条闸门全绿却一条评论都没送出，因为 clone 死在了证书校验上。
  #
  # 第 18 条断言下面这行 uses、这个 job 没有长回自己的 steps、以及 gates 里
  # 带的是真的 needs.*.result。
  # ==========================================================================
  report:
    name: 回报结果
    needs: [gate, web]
    if: always()
    permissions:
      contents: write          # commit 评论需要写权限
      pull-requests: write
    uses: supercubegame/ci-workflows/.github/workflows/report.yml@main
    with:
      node-version: '22'
      gates: '[{"name":"引擎闸门","result":"${{ needs.gate.result }}"},{"name":"浏览器闸门","result":"${{ needs.web.result }}"}]'
      composer-files: scripts/compose-report.mjs
      composer-entry: scripts/compose-report.mjs
      marker: '<!-- verify-gate -->'
