<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>JUMPWOW — 无限向上跳跃</title>
<meta name="description" content="踩着平台一路往上。落地自动起跳，你只管左右。世界左右相通。">
<meta property="og:title" content="JUMPWOW">
<meta property="og:description" content="无限向上跳跃。同一个种子永远是同一张图，来比比看。">
<style>
  :root{
    --ink:   oklch(97% 0.012 265);
    --muted: oklch(72% 0.030 265);
    --dim:   oklch(58% 0.028 265);
    --line:  oklch(38% 0.035 265);
    --accent:oklch(84% 0.155 88);
    --gold:  oklch(86% 0.150 92);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:oklch(16% 0.030 265)}
  body{
    font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    display:grid;
    place-items:center;
  }

  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 40 / 22));
    aspect-ratio:40 / 22;
    box-shadow:0 40px 90px -30px oklch(8% 0.04 265 / .9);
  }
  canvas#c{display:block;width:100%;height:100%}

  #hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
  #score{
    position:absolute;left:20px;top:14px;
    font:800 clamp(26px,4.4vh,44px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:-.03em;text-shadow:0 2px 14px oklch(12% 0.05 265 / .7);
  }
  #best{
    position:absolute;left:21px;top:calc(14px + clamp(28px,4.6vh,46px));
    font:600 11px/1 ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);
  }
  #meta{
    position:absolute;right:20px;top:16px;text-align:right;
    font:600 10px/1.9 ui-monospace,monospace;
    letter-spacing:.08em;color:var(--muted);white-space:pre-line;
  }

  .veil{
    position:absolute;inset:0;z-index:5;overflow-y:auto;
    display:grid;place-items:center;text-align:center;
    background:radial-gradient(120% 90% at 50% 40%,
               oklch(20% 0.04 265 / .55), oklch(13% 0.04 265 / .94));
    backdrop-filter:blur(7px);
  }
  .veil.hide{display:none}
  .veil .inner{padding:26px 24px;max-width:min(94%, 640px);width:100%}

  h1{font-size:clamp(34px,8vh,76px);font-weight:900;letter-spacing:-.045em;line-height:.92}
  h1 i{font-style:normal;color:var(--accent)}
  .tag{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.75}

  .keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0 18px;
        font-size:12px;color:var(--muted)}
  .keys div{border:1px solid var(--line);border-radius:9px;padding:7px 13px;
            background:oklch(22% 0.03 265 / .6)}
  kbd{color:var(--ink);font:700 11px/1 ui-monospace,monospace;
      border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
      padding:2px 5px;margin-right:5px}

  button{
    pointer-events:auto;cursor:pointer;
    font:800 15px/1 inherit;letter-spacing:.06em;
    color:oklch(18% 0.05 88);background:var(--accent);
    border:0;border-radius:12px;padding:15px 40px;
    box-shadow:0 12px 30px -12px oklch(84% 0.155 88 / .8);
    transition:transform .12s cubic-bezier(.22,1,.36,1);
  }
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(0)}
  button.ghost{
    background:transparent;color:var(--ink);
    border:1px solid var(--line);box-shadow:none;
    padding:13px 24px;font-size:13px;
  }
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}

  input[type=text]{
    pointer-events:auto;
    background:oklch(22% 0.03 265 / .8);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:13px 16px;
    font:600 14px/1 inherit;width:190px;text-align:center;
    outline:none;transition:border-color .12s;
  }
  input[type=text]:focus{border-color:var(--accent)}
  input[type=text]::placeholder{color:var(--dim)}

  .stats{display:flex;gap:26px;justify-content:center;margin:20px 0 20px}
  .stats div{font:600 10px/1.7 ui-monospace,monospace;letter-spacing:.1em;color:var(--muted)}
  .stats b{display:block;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.02em}

  .hint{margin-top:16px;font:600 10px/1.7 ui-monospace,monospace;color:var(--dim)}
  .hint.warn{color:oklch(75% 0.13 45)}
  .hint.good{color:oklch(80% 0.13 155)}

  .board{
    margin:22px auto 0;text-align:left;max-width:420px;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:oklch(19% 0.03 265 / .7);
  }
  .board h3{
    font:700 10px/1 ui-monospace,monospace;letter-spacing:.2em;
    color:var(--dim);padding:13px 16px 11px;
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  }
  .board ol{list-style:none;max-height:min(38vh,260px);overflow-y:auto}
  .board li{
    display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:baseline;
    padding:9px 16px;font-size:13px;border-top:1px solid oklch(28% 0.03 265 / .5);
  }
  .board li:first-child{border-top:0}
  .board li .rk{font:700 11px/1 ui-monospace,monospace;color:var(--dim);text-align:right}
  .board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board li .sc{font:700 14px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .board li.top .rk,.board li.top .sc{color:var(--gold)}
  .board li.me{background:oklch(26% 0.05 88 / .35)}
  .board li.me .nm::after{content:' ← 你';color:var(--accent);font-size:11px}
  .board .empty{padding:22px 16px;text-align:center;color:var(--dim);font-size:12px;line-height:1.8}

  #card{display:none;margin:18px auto 0;max-width:100%;border-radius:12px;
        border:1px solid var(--line)}
  #card.show{display:block}

  @media (max-width:560px){
    #score{left:14px;top:10px}
    #best{left:15px}
    #meta{right:14px;top:12px}
    .veil .inner{padding:20px 16px}
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <div id="best"></div>
    <div id="meta"></div>
  </div>

  <div id="start" class="veil">
    <div class="inner">
      <h1>JUMP<i>WOW</i></h1>
      <p class="tag">一路往上。落地自动起跳，你只管左右。<br>
         世界左右相通,从右边出去会从左边回来。</p>
      <div class="keys">
        <div><kbd>A</kbd><kbd>D</kbd> 或方向键</div>
        <div>手机点屏幕左右半边</div>
      </div>
      <div class="row">
        <input id="nameIn" type="text" maxlength="16" placeholder="你的名字" autocomplete="off">
        <button id="btnStart">开 始</button>
      </div>

      <div class="board" id="boardWrap">
        <h3><span>排 行 榜</span><span id="boardNote"></span></h3>
        <ol id="boardList"></ol>
      </div>

      <div class="hint" id="startHint"></div>
    </div>
  </div>

  <div id="over" class="veil hide">
    <div class="inner">
      <h1 style="font-size:clamp(28px,6vh,54px)">掉<i>下去了</i></h1>
      <div class="stats">
        <div>高度<b id="oScore">0</b></div>
        <div>跳跃<b id="oJumps">0</b></div>
        <div>最高<b id="oBest">0</b></div>
      </div>
      <div class="row">
        <button id="btnAgain">再 来 一 次</button>
        <button id="btnCard" class="ghost">生成分享图</button>
        <button id="btnLink" class="ghost">复制同图链接</button>
      </div>
      <div class="hint" id="subHint"></div>
      <canvas id="card" width="1200" height="630"></canvas>
      <div class="board" id="boardWrap2">
        <h3><span>排 行 榜</span><span id="boardNote2"></span></h3>
        <ol id="boardList2"></ol>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createGame, step, STEP, W, VIEW_H, PLAT, PLAT_W } from '../src/engine.js';
import { botInput } from '../src/bot.js';
import { createRecorder } from '../src/replay.js';

/* =========================================================================
 * 浏览器渲染器 + 排行榜客户端
 *
 * 这个文件只画画、收输入、跟服务端说话,一行游戏逻辑都没有。
 * 引擎是纯函数（不碰终端、不碰文件、不用 Math.random），所以同一份
 * src/engine.js 同时驱动终端版和这里，两边逐帧一致。
 *
 * 排行榜有两级：
 *   有 API  → 全球榜。客户端只上报「种子 + 逐帧输入」，服务端重放判分，
 *             改内存里的 score 毫无意义。
 *   无 API  → 本机榜（localStorage）。纯静态部署（比如 GitHub Pages）
 *             就是这种情况。它不假装权威，界面上明确标「仅本机」。
 * ========================================================================= */

const QS    = new URLSearchParams(location.search);
const BOT   = QS.get('bot') === '1';
const SEED0 = QS.has('seed') ? (parseInt(QS.get('seed'), 10) >>> 0) : null;

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false, willReadFrequently: true });

const $ = id => document.getElementById(id);
const el = {
  score: $('score'), best: $('best'), meta: $('meta'),
  start: $('start'), over: $('over'),
  oScore: $('oScore'), oJumps: $('oJumps'), oBest: $('oBest'),
  nameIn: $('nameIn'), startHint: $('startHint'), subHint: $('subHint'),
  boardList: $('boardList'), boardList2: $('boardList2'),
  boardNote: $('boardNote'), boardNote2: $('boardNote2'),
  card: $('card'), btnCard: $('btnCard'), btnLink: $('btnLink'),
};

/* ----------------------------- 画面尺寸 ----------------------------- */
let CW = 0, CH = 0, PX = 0, PY = 0;

function resize(){
  const r   = cv.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  CW = Math.max(320, Math.round((r.width  || 900) * dpr));
  CH = Math.max(200, Math.round((r.height || 495) * dpr));
  cv.width = CW; cv.height = CH;
  PX = CW / W;
  PY = CH / VIEW_H;
}
addEventListener('resize', resize);

/* ----------------------------- 调色 ----------------------------- */
const SKIES = [
  { at:   0, top: [ 44,  62, 108], bot: [122, 104, 138] },
  { at: 180, top: [ 30,  44,  92], bot: [ 92,  74, 132] },
  { at: 420, top: [ 20,  26,  66], bot: [ 58,  44, 104] },
  { at: 900, top: [ 10,  12,  38], bot: [ 32,  22,  72] },
];
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = a => 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')';

function skyAt(h){
  let i = 0;
  while (i < SKIES.length - 2 && h > SKIES[i + 1].at) i++;
  const a = SKIES[i], b = SKIES[i + 1];
  const t = Math.max(0, Math.min(1, (h - a.at) / (b.at - a.at)));
  return { top: mix(a.top, b.top, t), bot: mix(a.bot, b.bot, t) };
}

const SKIN = {
  [PLAT.NORMAL]:  { face: '#7ee0a4', edge: '#3f9a6a' },
  [PLAT.MOVING]:  { face: '#7cc8f5', edge: '#3a7fae' },
  [PLAT.FRAGILE]: { face: '#e8bd7c', edge: '#a37438' },
  [PLAT.SPRING]:  { face: '#f59ad4', edge: '#a94f8c' },
};

const STARS = (function(){
  let t = 0x9e3779b9;
  const rnd = () => {
    t = (t + 0x6D2B79F5) | 0;
    let x = Math.imul(t ^ (t >>> 15), 1 | t);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
  const out = [];
  for (const L of [[70, 0.10, 1.0], [40, 0.24, 1.6], [18, 0.42, 2.5]]){
    for (let i = 0; i < L[0]; i++){
      out.push({ x: rnd() * W, y: rnd() * 120, depth: L[1], r: L[2], a: 0.22 + rnd() * 0.55 });
    }
  }
  return out;
})();

/* ----------------------------- 粒子 ----------------------------- */
const dust = [];
function puff(x, y, n){
  for (let i = 0; i < n; i++){
    const a  = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 8;
    const life = 0.3 + Math.random() * 0.35;
    dust.push({ x, y, vx: Math.cos(a) * sp,
                vy: Math.abs(Math.sin(a)) * sp * 0.4 + 1.5,
                life, max: life, r: 0.1 + Math.random() * 0.2 });
  }
}
function stepDust(dt){
  for (let i = dust.length - 1; i >= 0; i--){
    const p = dust[i];
    p.life -= dt;
    if (p.life <= 0){ dust.splice(i, 1); continue; }
    p.vy -= 44 * dt;
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
  }
}

/* ----------------------------- 状态 ----------------------------- */
let game = null;
let mode = 'menu';
let camRender = 0;
let shake = 0, squash = 0, lastJumps = 0;
let frames = 0, acc = 0, last = 0;
let lastResult = null;

const keys = { left: false, right: false };
const rec  = createRecorder();

const best   = () => Number(localStorage.getItem('jumpwow.best') || 0);
const myName = () => (localStorage.getItem('jumpwow.name') || '').trim();

/* ----------------------------- 排行榜 ----------------------------- */
let apiUp = null;                   // null 未知 / true 有服务端 / false 纯静态

/** 本机榜。纯静态部署时用,不假装权威，界面会明确标出来。 */
function localBoard(){
  try{ return JSON.parse(localStorage.getItem('jumpwow.local') || '[]'); }
  catch(e){ return []; }
}
function pushLocal(entry){
  const list = localBoard();
  list.push(entry);
  list.sort((a, b) => b.score - a.score || a.at - b.at);
  const top = list.slice(0, 20);
  try{ localStorage.setItem('jumpwow.local', JSON.stringify(top)); }catch(e){}
  return top.indexOf(entry) + 1;
}

async function fetchBoard(){
  try{
    const r = await fetch('api/scores?limit=20', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    apiUp = true;
    return d.scores || [];
  }catch(e){
    apiUp = false;
    return null;
  }
}

function esc(s){
  return String(s).replace(/[<>&]/g, c => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));
}

function paintBoard(listEl, noteEl, scores, verified, highlightAt){
  if (noteEl) noteEl.textContent = verified ? '服务端重放验证' : '仅本机';
  if (!scores || !scores.length){
    listEl.innerHTML = '<div class="empty">' +
      (verified ? '还没有人上榜。第一个就是你。'
                : '还没有记录。玩一局就有了。') + '</div>';
    return;
  }
  listEl.innerHTML = scores.map((s, i) => {
    const cls = (i < 3 ? 'top ' : '') + (highlightAt && s.at === highlightAt ? 'me' : '');
    return '<li class="' + cls.trim() + '">' +
           '<span class="rk">' + (i + 1) + '</span>' +
           '<span class="nm">' + esc(s.name) + '</span>' +
           '<span class="sc">' + s.score + '</span></li>';
  }).join('');
}

async function refreshBoards(highlightAt){
  const remote = await fetchBoard();
  const verified = apiUp === true;
  const scores = verified ? remote : localBoard();
  paintBoard(el.boardList,  el.boardNote,  scores, verified, highlightAt);
  paintBoard(el.boardList2, el.boardNote2, scores, verified, highlightAt);

  el.startHint.className = 'hint';
  el.startHint.textContent = verified
    ? '成绩由服务端重放你的每一帧操作后判定，改分数没用'
    : '当前是纯静态部署，排行榜只存在这台设备上';
  return scores;
}

async function submitRun(){
  if (!game || game.alive) return;

  // 纯静态：记到本机榜，并且诚实地说明它只是本机的
  if (apiUp === false){
    const rank = pushLocal({ name: myName() || '匿名跳跃者', score: game.score,
                             seed: game.seed, at: Date.now() });
    lastResult = { rank, verified: false };
    el.subHint.className = 'hint';
    el.subHint.textContent = '本机第 ' + rank + ' 名（这是纯静态部署，没有全球榜）';
    await refreshBoards();
    return;
  }

  el.subHint.className = 'hint';
  el.subHint.textContent = '正在提交,服务端会重放你这局的每一帧';
  try{
    const r = await fetch('api/scores', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      // 注意这里没有 score 字段。分数由服务端重放算出，客户端说了不算。
      body: JSON.stringify({ name: myName(), seed: game.seed, log: rec.encode() }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    lastResult = d;
    el.subHint.className = 'hint good';
    el.subHint.textContent = '已验证上榜 · 第 ' + d.rank + ' 名 · ' +
                             rec.encode().length + ' 字节操作日志';
    await refreshBoards(d.entry.at);
  }catch(e){
    el.subHint.className = 'hint warn';
    el.subHint.textContent = '提交失败：' + e.message;
    await refreshBoards();
  }
}

/* ----------------------------- 生命周期 ----------------------------- */
function begin(seed){
  game = createGame(seed != null ? seed : ((Math.random() * 0xffffffff) >>> 0));
  camRender = game.cam;
  dust.length = 0;
  rec.reset();
  lastJumps = 0; shake = 0; squash = 0; acc = 0;
  lastResult = null;
  mode = 'play';
  el.card.classList.remove('show');
  el.subHint.textContent = '';
  el.start.classList.add('hide');
  el.over.classList.add('hide');
}

function finish(){
  mode = 'over';
  const b = Math.max(best(), game.score);
  try{ localStorage.setItem('jumpwow.best', String(b)); }catch(e){}
  el.oScore.textContent = game.score;
  el.oJumps.textContent = game.stats.jumps;
  el.oBest.textContent  = b;
  el.over.classList.remove('hide');
  if (!BOT) submitRun();
}

/* ----------------------------- 输入 ----------------------------- */
addEventListener('keydown', e => {
  if (document.activeElement === el.nameIn) return;      // 打名字时别当成操作
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.left  = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if (mode !== 'play') startFromUI();
  }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.left  = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
addEventListener('blur', () => { keys.left = keys.right = false; });

function touch(e){
  if (mode !== 'play') return;
  e.preventDefault();
  keys.left = keys.right = false;
  const r = cv.getBoundingClientRect();
  for (const t of e.touches){
    if (t.clientX - r.left < r.width / 2) keys.left = true; else keys.right = true;
  }
}
cv.addEventListener('touchstart', touch, { passive: false });
cv.addEventListener('touchmove',  touch, { passive: false });
cv.addEventListener('touchend', e => {
  if (!e.touches.length) keys.left = keys.right = false;
}, { passive: true });

function startFromUI(){
  const n = el.nameIn.value.trim();
  if (n) try{ localStorage.setItem('jumpwow.name', n); }catch(e){}
  begin(mode === 'menu' ? SEED0 : null);
}
$('btnStart').onclick = startFromUI;
$('btnAgain').onclick = () => begin();

/* ----------------------------- 分享 ----------------------------- */
el.btnCard.onclick = () => {
  drawCard();
  el.card.classList.add('show');
  el.card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  try{
    el.card.toBlob(b => {
      if (!b) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'jumpwow-' + (game ? game.score : 0) + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    });
  }catch(e){}
};

el.btnLink.onclick = async () => {
  const u = location.origin + location.pathname + '?seed=' + (game ? game.seed : 0);
  try{
    await navigator.clipboard.writeText(u);
    el.btnLink.textContent = '已复制';
    setTimeout(() => { el.btnLink.textContent = '复制同图链接'; }, 1800);
  }catch(e){
    el.subHint.className = 'hint';
    el.subHint.textContent = u;
  }
};

/** 画一张 1200x630 的分享图。种子写在上面,别人打开链接就是同一张图。 */
function drawCard(){
  const g = el.card.getContext('2d');
  const Wc = el.card.width, Hc = el.card.height;
  const s = game;
  const sky = skyAt(s ? s.maxY : 0);

  const bg = g.createLinearGradient(0, 0, 0, Hc);
  bg.addColorStop(0, rgb(sky.top));
  bg.addColorStop(1, rgb(sky.bot));
  g.fillStyle = bg;
  g.fillRect(0, 0, Wc, Hc);

  if (s){
    g.globalAlpha = 0.28;
    for (const pl of s.platforms){
      g.fillStyle = SKIN[pl.type].face;
      const x = (pl.x / W) * Wc;
      const y = Hc - ((pl.y - s.cam) / VIEW_H) * Hc;
      g.fillRect(x - (PLAT_W / W) * Wc / 2, y, (PLAT_W / W) * Wc, 12);
    }
    g.globalAlpha = 1;
  }

  g.fillStyle = 'rgba(10,14,30,.42)';
  g.fillRect(0, 0, Wc, Hc);

  const pad = 72;
  g.textBaseline = 'alphabetic';

  g.fillStyle = '#ffd76b';
  g.font = '900 58px ui-monospace, SFMono-Regular, Menlo, monospace';
  g.fillText('JUMPWOW', pad, pad + 52);

  g.fillStyle = 'rgba(255,255,255,.62)';
  g.font = '600 22px ui-sans-serif, system-ui, sans-serif';
  g.fillText(myName() || '匿名跳跃者', pad, pad + 96);

  g.fillStyle = '#fff';
  g.font = '900 190px ui-monospace, SFMono-Regular, Menlo, monospace';
  g.fillText(String(s ? s.score : 0), pad - 6, Hc - 172);

  const facts = [
    '跳跃 ' + (s ? s.stats.jumps : 0) + ' 次',
    '弹簧 ' + (s ? s.stats.springs : 0) + ' 次',
    '踩碎 ' + (s ? s.stats.broken : 0) + ' 块',
  ];
  if (lastResult && lastResult.rank){
    facts.unshift((lastResult.verified ? '全球第 ' : '本机第 ') + lastResult.rank + ' 名');
  }

  g.font = '600 26px ui-sans-serif, system-ui, sans-serif';
  g.fillStyle = 'rgba(255,255,255,.82)';
  g.fillText(facts.join('   ·   '), pad, Hc - 108);

  g.font = '600 20px ui-monospace, monospace';
  g.fillStyle = 'rgba(255,255,255,.45)';
  g.fillText('SEED ' + (s ? s.seed : 0) + '   ·   同一个种子永远是同一张图，来比比看', pad, Hc - 60);

  // 只有真的通过服务端验证才印这行字。本机榜不配。
  if (lastResult && lastResult.verified){
    g.fillStyle = 'rgba(140,240,190,.9)';
    g.font = '700 20px ui-sans-serif, system-ui, sans-serif';
    const t = '服务端重放验证通过';
    g.fillText(t, Wc - pad - g.measureText(t).width, pad + 52);
  }
}

/* ----------------------------- 绘制 ----------------------------- */
const sx = wx => wx * PX;
const sy = wy => CH - (wy - camRender) * PY;

function roundRect(x, y, w, h, r){
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y,     x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x,     y + h, rr);
  ctx.arcTo(x,     y + h, x,     y,     rr);
  ctx.arcTo(x,     y,     x + w, y,     rr);
  ctx.closePath();
}

function drawPlatform(pl){
  const skin = SKIN[pl.type];
  const w = PLAT_W * PX;
  const h = Math.max(6, 0.5 * PY);
  const y = sy(pl.y) - h * 0.35;

  for (const off of [-W, 0, W]){
    const x = sx(pl.x + off) - w / 2;
    if (x > CW || x + w < 0) continue;

    ctx.fillStyle = skin.edge;
    roundRect(x, y + h * 0.45, w, h * 0.9, h * 0.4); ctx.fill();
    ctx.fillStyle = skin.face;
    roundRect(x, y, w, h, h * 0.42); ctx.fill();

    if (pl.type === PLAT.SPRING){
      ctx.fillStyle = 'rgba(255,255,255,.88)';
      const cx = x + w / 2, t = h * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx - t, y + h * 0.2);
      ctx.lineTo(cx,     y - h * 0.5);
      ctx.lineTo(cx + t, y + h * 0.2);
      ctx.closePath(); ctx.fill();
    }
    if (pl.type === PLAT.FRAGILE){
      ctx.strokeStyle = 'rgba(0,0,0,.3)';
      ctx.lineWidth = Math.max(1, h * 0.12);
      ctx.beginPath();
      for (let i = 1; i < 4; i++){
        const gx = x + (w * i) / 4;
        ctx.moveTo(gx, y + h * 0.12);
        ctx.lineTo(gx - h * 0.2, y + h * 0.88);
      }
      ctx.stroke();
    }
  }
}

function drawPlayer(p){
  const base = 0.95 * PY;
  const stretch = Math.max(-0.3, Math.min(0.28, p.vy / 95)) - squash;
  const w = base * (1 - stretch * 0.6);
  const h = base * (1 + stretch);
  const y = sy(p.y) - h;

  for (const off of [-W, 0, W]){
    const x = sx(p.x + off) - w / 2;
    if (x > CW || x + w < 0) continue;

    ctx.fillStyle = 'rgba(0,0,0,.25)';
    roundRect(x + w * 0.08, y + h * 0.1, w, h, w * 0.3); ctx.fill();
    ctx.fillStyle = '#ffd76b';
    roundRect(x, y, w, h, w * 0.3); ctx.fill();

    ctx.fillStyle = '#2b2210';
    const ew = w * 0.15, eh = h * 0.17, ey = y + h * 0.3;
    const dir = keys.right ? w * 0.09 : keys.left ? -w * 0.09 : 0;
    roundRect(x + w * 0.26 + dir, ey, ew, eh, ew * 0.4); ctx.fill();
    roundRect(x + w * 0.59 + dir, ey, ew, eh, ew * 0.4); ctx.fill();
  }
}

function render(){
  const sky = skyAt(game ? game.maxY : 0);
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, rgb(sky.top));
  g.addColorStop(1, rgb(sky.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);

  ctx.save();
  if (shake > 0.002){
    ctx.translate((Math.random() - 0.5) * shake * PX,
                  (Math.random() - 0.5) * shake * PY);
  }

  ctx.fillStyle = '#fff';
  for (const st of STARS){
    let py = CH - ((st.y - camRender * st.depth) % 120) / 120 * CH;
    py = ((py % CH) + CH) % CH;
    ctx.globalAlpha = st.a * 0.75;
    ctx.beginPath();
    ctx.arc(sx(st.x), py, st.r * (PY / 26 + 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (game){
    for (const pl of game.platforms){
      if (pl.broken) continue;
      const y = sy(pl.y);
      if (y < -50 || y > CH + 50) continue;
      drawPlatform(pl);
    }
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (const p of dust){
      ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.8;
      ctx.beginPath();
      ctx.arc(sx(p.x), sy(p.y), Math.max(1, p.r * PY), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawPlayer(game.player);
  }

  ctx.restore();

  const vg = ctx.createLinearGradient(0, 0, 0, CH * 0.3);
  vg.addColorStop(0, 'rgba(0,0,0,.38)');
  vg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, CW, CH * 0.3);
}

/* ----------------------------- 主循环 ----------------------------- */
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  frames++;

  if (mode === 'play' && game){
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 6){
      acc -= STEP;
      const input = BOT ? botInput(game) : keys;
      rec.push(input);                 // 记在 step 之前：日志必须和实际喂进引擎的一致
      step(game, input);

      if (game.stats.jumps > lastJumps){
        lastJumps = game.stats.jumps;
        puff(game.player.x, game.player.y, 7);
        squash = 0.26;
        shake = Math.min(0.45, shake + 0.16);
      }
      if (!game.alive){ finish(); break; }
    }

    camRender += (game.cam - camRender) * Math.min(1, dt * 9);
    squash *= Math.pow(0.001, dt);
    shake  *= Math.pow(0.0004, dt);
    stepDust(dt);

    el.score.textContent = game.score;
    const b = best();
    el.best.textContent = b ? 'BEST ' + b : '';
    el.meta.textContent = 'SEED ' + game.seed + '\n跳跃 ' + game.stats.jumps;
  }

  render();
}

/* ----------------------------- 诊断出口 ----------------------------- */
/* 只读。给无头闸门用,没有它，浏览器测试只能靠截图猜。 */
window.__DIAG__ = {
  ready: false,
  get frames(){ return frames; },
  get mode(){ return mode; },
  get seed(){ return game ? game.seed : null; },
  get score(){ return game ? game.score : 0; },
  get alive(){ return game ? game.alive : false; },
  get jumps(){ return game ? game.stats.jumps : 0; },
  get platforms(){ return game ? game.platforms.length : 0; },
  get playerPos(){ return game ? { x: game.player.x, y: game.player.y } : null; },
  get dust(){ return dust.length; },
  get logTicks(){ return rec.ticks; },
  get logSize(){ return rec.encode().length; },
  get apiUp(){ return apiUp; },
  get boardRows(){ return el.boardList.querySelectorAll('li').length; },
  get submitHint(){ return el.subHint.textContent; },
  start(seed){ begin(seed); return true; },
  setName(n){ try{ localStorage.setItem('jumpwow.name', n); }catch(e){} el.nameIn.value = n; return true; },
  makeCard(){ drawCard(); el.card.classList.add('show'); return true; },
  get cardDrawn(){
    const g = el.card.getContext('2d');
    const d = g.getImageData(el.card.width >> 1, el.card.height >> 1, 1, 1).data;
    return d[3] > 0 && (d[0] + d[1] + d[2]) > 0;
  },
  sampleColors(){
    const n = 20, set = new Set();
    for (let i = 0; i < n; i++){
      for (let j = 0; j < n; j++){
        const d = ctx.getImageData(
          Math.floor((i + 0.5) * CW / n),
          Math.floor((j + 0.5) * CH / n), 1, 1).data;
        set.add((d[0] >> 3) + ',' + (d[1] >> 3) + ',' + (d[2] >> 3));
      }
    }
    return set.size;
  },
};

/* ----------------------------- 启动 ----------------------------- */
resize();
requestAnimationFrame(frame);
el.nameIn.value = myName();
el.best.textContent = best() ? 'BEST ' + best() : '';
refreshBoards();
window.__DIAG__.ready = true;

if (BOT) begin(SEED0);          // 无头测试用：跳过点击直接开局
</script>
